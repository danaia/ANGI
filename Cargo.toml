[workspace]
members = ["crates/agx-core", "crates/agx-tui", "crates/agx-cli", "crates/agx-net", "crates/agx-profile", "crates/agx-init", "crates/agx-bluetooth", "crates/agx-bluetoothd", "crates/agx-security"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
agx-init = { path = "crates/agx-init" }
agx-profile = { path = "crates/agx-profile" }
agx-core = { path = "crates/agx-core" }
agx-net = { path = "crates/agx-net" }
agx-bluetooth = { path = "crates/agx-bluetooth" }
agx-security = { path = "crates/agx-security" }
zeroize = { version = "1", features = ["serde"] }
pbkdf2 = "0.12"
sha1 = "0.10"
agx-tui = { path = "crates/agx-tui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
# Wrapped line counts keep scrolling bounded when the terminal resizes.
ratatui = { version = "=0.30.2", features = ["unstable-rendered-line-info"] }
signal-hook = "0.3"
# Use the bounded /dev/tty reader rather than the Mio EOF loop on disconnect.
crossterm = { version = "=0.29.0", features = ["use-dev-tty"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
