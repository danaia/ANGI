image boot.vfat {
    vfat {
        files = {
            "Image",
            "bcm2712-rpi-5-b.dtb",
            "bcm2712d0-rpi-5-b.dtb",
            "rpi-firmware/config.txt",
            "rpi-firmware/cmdline.txt",
            "rpi-firmware/overlays"
        }
    }
    size = 128M
}

image sdcard.img {
    hdimage {
        disk-signature = 0x41475805
    }
    partition boot {
        partition-type = 0xC
        bootable = "true"
        image = "boot.vfat"
    }
    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
    }
}
