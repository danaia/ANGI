image efi.vfat {
    vfat {
        file EFI { image = "efi-part/EFI" }
        file @KERNEL@ { image = "@KERNEL@" }
    }
    size = 128M
}

image disk.img {
    hdimage {
        partition-table-type = "gpt"
    }
    partition boot {
        partition-type-uuid = U
        offset = 1M
        image = "efi.vfat"
    }
    partition rootfs {
        partition-type-uuid = L
        partition-uuid = @ROOT_UUID@
        image = "rootfs.ext4"
    }
}
