[package]
name = "agx-gui"
version = "0.4.0"
edition = "2024"
rust-version = "1.97"
build = "build.rs"

# Standalone so the core Rust workspace does not require the desktop's native
# libraries. The optional Buildroot agx-gui package builds this workspace.
[workspace]

[[bin]]
name = "agx-gui"
path = "src/main.rs"

[features]
# Preview on a desktop (Wayland/X11) window.
default = ["desktop"]
desktop = ["slint/backend-winit", "slint/renderer-femtovg", "slint/renderer-software", "dep:glow"]
# Native client for a standalone Wayland compositor.
wayland = ["slint/backend-winit-wayland", "slint/renderer-femtovg", "slint/renderer-software", "dep:glow", "dep:i-slint-backend-winit"]
# Appliance mode with a software framebuffer and no local display backend.
headless = ["slint/renderer-software", "dep:i-slint-core"]
# Appliance mode: draw straight to DRM/KMS with libinput. No display server.
kms = ["dep:glow", "dep:libloading", "dep:input", "slint/unstable-libinput-09", "slint/backend-linuxkms-noseat", "slint/renderer-femtovg", "slint/renderer-software"]

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
png = "0.18"
sha2 = "0.10"
glow = { version = "=0.18.0", optional = true }
libloading = { version = "=0.8.9", optional = true }
input = { version = "=0.10.0", optional = true, default-features = false, features = ["libinput_1_19"] }
agx-core = { path = "../agx-core" }
agx-profile = { path = "../agx-profile" }
agx-net = { path = "../agx-net" }
agx-bluetooth = { path = "../agx-bluetooth" }
zeroize = "1"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", features = ["serde"] }
signal-hook = "0.3"
# Enable embedded icon decoders in the absence of the Winit and KMS backends.
i-slint-core = { version = "=1.19.0", optional = true, default-features = false, features = ["image-decoders", "svg"] }
# Slint's Winit interop feature also enables X11. Use the matching backend
# directly to install the pointer event filter on the Wayland-only build.
i-slint-backend-winit = { version = "=1.19.0", optional = true, default-features = false }
slint = { version = "1.19.0", default-features = false, features = ["std", "compat-1-2"] }
alacritty_terminal = { version = "=0.26.0", default-features = false }

[build-dependencies]
slint-build = "1.19.0"
