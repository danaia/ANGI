<!doctype html>
<html>
<head><meta charset="utf-8"><title>Avatar — preview</title></head>
<body>
<div id="root" class="pl-demo"></div>
<script>
  var P = window.PebbleLine, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(React.Fragment, null,
      h(P.Avatar, { name: 'Dana Ruiz', status: 'online' }),
      h(P.Avatar, { name: 'Sam Lee', size: 64, status: 'away' }),
      h(P.Avatar, { name: 'Ana Ko', size: 36, status: 'offline' }))
  );
</script>
</body>
</html>
