<!doctype html>
<html>
<head><meta charset="utf-8"><title>Badge — preview</title></head>
<body>
<div id="root" class="pl-demo"></div>
<script>
  var P = window.PebbleLine, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(React.Fragment, null,
      h(P.Badge, null, 'Draft'),
      h(P.Badge, { tone: 'accent' }, 'New'),
      h(P.Badge, { tone: 'success', dot: true }, 'In stock'),
      h(P.Badge, { tone: 'warning', dot: true }, 'Low'),
      h(P.Badge, { tone: 'danger', dot: true }, 'Sold out'))
  );
</script>
</body>
</html>
