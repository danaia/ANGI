<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon — preview</title></head>
<body>
<div id="root" class="pl-demo"></div>
<script>
  var P = window.PebbleLine, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(11, 40px)', gap: 12, color: 'var(--ink)' } },
      P.Icon.names.map(function (n) { return h('span', { key: n, title: n, style: { display: 'grid', placeItems: 'center', height: 40 } }, h(P.Icon, { name: n, size: 22 })); }))
  );
</script>
</body>
</html>
