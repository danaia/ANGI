<!doctype html>
<html>
<head><meta charset="utf-8"><title>IconButton — preview</title></head>
<body>
<div id="root" class="pl-demo"></div>
<script>
  var P = window.PebbleLine, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(React.Fragment, null,
      h(P.IconButton, { icon: 'heart', label: 'Like' }),
      h(P.IconButton, { icon: 'bell', label: 'Notifications', active: true }),
      h(P.IconButton, { icon: 'settings', label: 'Settings', size: 'lg' }),
      h(P.IconButton, { icon: 'plus', label: 'Add', size: 'sm' }),
      h(P.IconButton, { icon: 'grid', label: 'Grid view', shape: 'square' }))
  );
</script>
</body>
</html>
