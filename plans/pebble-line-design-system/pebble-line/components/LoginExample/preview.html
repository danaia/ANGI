<!doctype html>
<html>
<head><meta charset="utf-8"><title>LoginExample — preview</title></head>
<body>
<div id="root" class="pl-demo"></div>
<script>
  var P = window.PebbleLine, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { width: 380 } }, h(P.Card, { variant: 'hero' },
      h('h1', { style: { fontSize: 32, lineHeight: '40px', fontWeight: 600, textAlign: 'center', margin: '0 0 24px' } }, 'Login'),
      h('div', { style: { display: 'flex', flexDirection: 'column', gap: 20 } },
        h(P.TextField, { label: 'Username', placeholder: 'Username', autoComplete: 'username' }),
        h(P.TextField, { label: 'Password', type: 'password', placeholder: '••••••••', autoComplete: 'current-password' }),
        h(P.Checkbox, { label: 'Remember me' })),
      h('div', { style: { display: 'flex', justifyContent: 'center', marginTop: 28 } }, h(P.Button, { variant: 'secondary' }, 'Login')),
      h('div', { style: { textAlign: 'right', marginTop: 16, fontSize: 13 } }, h('a', { className: 'pl-link', href: '#' }, 'Forgot password?'))))
  );
</script>
</body>
</html>
