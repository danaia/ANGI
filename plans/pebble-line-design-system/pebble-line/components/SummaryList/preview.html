<!-- @dsCard group="Data display" height=370 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>SummaryList — preview</title></head>
<body>
<div id="root" class="pl-demo"></div>
<script>
  var P = window.PebbleLine, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(P.Card, { title: 'Cart Summary', style: { width: 320 } },
      h(P.Card, { variant: 'muted' }, h(P.SummaryList, { rows: [{ label: 'Subtotal', value: '$320' }, { label: 'Shipping', value: '$0' }, { label: 'Total', value: '$320', total: true }] })))
  );
</script>
</body>
</html>
