<!doctype html>
<html>
<head><meta charset="utf-8"><title>TextField — preview</title></head>
<body>
<div id="root" class="pl-demo pl-demo--col"></div>
<script>
  var P = window.PebbleLine, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(React.Fragment, null,
      h(P.TextField, { label: 'Username', placeholder: 'Username' }),
      h(P.TextField, { label: 'Password', type: 'password', defaultValue: 'pebble-stone' }),
      h(P.TextField, { label: 'Search', icon: 'search', placeholder: 'Search products' }),
      h(P.TextField, { label: 'Min', prefix: '$', defaultValue: '20', hint: 'Lowest price shown' }),
      h(P.TextField, { label: 'Email', icon: 'mail', defaultValue: 'dana@', error: 'Enter a full email address' }))
  );
</script>
</body>
</html>
