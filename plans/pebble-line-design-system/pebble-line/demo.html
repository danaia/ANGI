<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Pebble Line — demo</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components/bundle.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="components/bundle.js"></script>
</head>
<body>
<div id="root" class="pl-demo"></div>
<script>
  var P = window.PebbleLine, h = React.createElement;
  function App() {
    var s = React.useState('light'), theme = s[0];
    React.useEffect(function () { document.documentElement.setAttribute('data-theme', theme); }, [theme]);
    return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 24 } },
      h(P.SegmentedControl, { 'aria-label': 'Theme', value: theme, onChange: s[1], options: [{ value: 'light', label: 'Light' }, { value: 'dark', label: 'Dark' }] }),
      h('div', { style: { width: 380 } }, h(P.Card, { variant: 'hero' },
        h('h1', { style: { fontSize: 32, fontWeight: 600, textAlign: 'center', margin: '0 0 24px' } }, 'Login'),
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: 20 } },
          h(P.TextField, { label: 'Username', placeholder: 'Username' }),
          h(P.TextField, { label: 'Password', type: 'password', placeholder: '••••••••' })),
        h('div', { style: { display: 'flex', justifyContent: 'center', marginTop: 28 } }, h(P.Button, { variant: 'primary' }, 'Login')))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
